# Public chatbot — no auth required so visitors can chat with the assistant
[functions.chat]
verify_jwt = false

# Admin signup flow — called before the caller has a session
[functions.admin-request-code]
verify_jwt = false

[functions.admin-verify-signup]
verify_jwt = false

# Supabase Auth Send SMS hook — called by Auth with a signed webhook, not a user JWT
[functions.send-sms-hook]
verify_jwt = false

# Internal staff help assistant: logged-in staff/workers only (never the public site)
[functions.staff-assistant]
verify_jwt = true

# Called by the database (pg_net) with a shared secret header, not a user JWT
[functions.send-notification-email]
verify_jwt = false
